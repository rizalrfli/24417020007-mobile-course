    - assets/fonts/
    - assets/cover/
    - assets/cover/nina.png
    - assets/cover/everything u are.png
    - assets/cover/everything-u-are.png
    - assets/cover/payung-teduh.png
    - assets/cover/akad.png
    - assets/cover/peradaban.png
    - assets/cover/honeybee.png
    - assets/gambar/
    - assets/gambar/nina.png
    - assets/gambar/everything u are.png
    - assets/gambar/payung-teduh.png
    - assets/gambar/akad.png
    - assets/gambar/peradaban.png
    - assets/gambar/honeybee.png
    - assets/logo/
    - assets/logo/logo.png
